name: build_android

on:
  push:
    paths:
      - "android/**"
      - "bridge/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
      - "bridge/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The shim in the app must stay a byte-identical copy of the contract.
      - name: Verify bridge shim is in sync
        run: diff bridge/native-bridge.js android/app/src/main/assets/native-bridge.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: abap2ui5-shell-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
