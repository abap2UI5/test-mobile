name: build_ios

on:
  push:
    paths:
      - "ios/**"
      - "bridge/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "bridge/**"
  workflow_dispatch:

jobs:
  build:
    # macos-15+ required: current XcodeGen writes Xcode project format 77,
    # which the Xcode 15.4 of the macos-14 image cannot open. Keep runner
    # image and XcodeGen in step — if this build ever fails with "future
    # Xcode project file format", the runner's Xcode is behind XcodeGen
    # again and the image needs bumping (versions are echoed below).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify bridge shim is in sync
        run: diff bridge/native-bridge.js ios/Resources/native-bridge.js

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen --version
          xcodegen generate

      - name: Build (simulator, unsigned)
        working-directory: ios
        run: |
          xcodebuild build \
            -project Abap2UI5Shell.xcodeproj \
            -scheme Abap2UI5Shell \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO
